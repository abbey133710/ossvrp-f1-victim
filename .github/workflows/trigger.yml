--- # Mirrors gemini-cli .github/workflows/trigger_e2e.yml (the LOW-privilege half).
# Runs in the untrusted fork-PR context: read-only token, NO repo secrets.
# Its only job is to launder the attacker-controlled head repo+sha into an artifact.
name: 'Trigger E2E'

on:
  pull_request:

jobs:
  save_repo_name:
    runs-on: ubuntu-latest
    steps:
      - name: 'Save Repo name'
        env:
          REPO_NAME: '${{ github.event.pull_request.head.repo.full_name }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
        run: |
          mkdir -p ./pr
          echo "${REPO_NAME}" > ./pr/repo_name
          echo "${HEAD_SHA}" > ./pr/head_sha
          echo "Laundered into artifact -> repo=${REPO_NAME} sha=${HEAD_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: repo_name
          path: pr/
